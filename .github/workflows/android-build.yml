name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ] # Added: Trigger release on tags like v1.0.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Install dependencies
      run: |
        go mod download
        go mod verify
        
    - name: Install Fyne CLI
      run: go install fyne.io/fyne/v2/cmd/fyne@latest
      
    - name: Build Android APK (ARM64 only)
      run: |
        fyne package --target android/arm64 --appID com.virakt.imgshrink --icon Icon.png --release
        
    - name: List build artifacts
      run: |
        echo "=== Build artifacts ==="
        ls -lh *.apk || echo "No APK files found in root"
        
    - name: Upload ARM64 APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: imgshrink-arm64-apk
        path: ImgShrink.apk
        if-no-files-found: error

    # NEW STEP: Create Release and Upload APK
    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') # Only runs when you push a tag
      with:
        files: ImgShrink.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false

