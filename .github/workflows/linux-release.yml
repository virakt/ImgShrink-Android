name: Linux Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    - name: Build Linux binary
      run: |
        go build -ldflags="-s -w" -o imgshrink-mobile-${{ steps.version.outputs.version }}-linux-amd64

    - name: Upload Linux binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./imgshrink-mobile-${{ steps.version.outputs.version }}-linux-amd64
        asset_name: ImgShrink-linux-${{ steps.version.outputs.version }}-amd64
        asset_content_type: application/octet-stream

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: ImgShrink Mobile Linux ${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        body: |
          ## ImgShrink Mobile - Linux Release
          
          ### Features
          - 🖼️ Compress JPEG and PNG images
          - 🎨 Minimal pitch black glassy UI with moonish blue tints
          - ⚙️ Adjustable quality and compression settings
          - 💾 Choose save location
          - 📊 Real-time compression preview
          
          ### Installation
          Download the binary for your architecture and make it executable:
          
          ```bash
          chmod +x ImgShrink-linux-x.x.x-amd64
          ./ImgShrink-linux-x.x.x-amd64
          ```

    - name: Upload Linux binary to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./imgshrink-mobile-${{ steps.version.outputs.version }}-linux-amd64
        asset_name: ImgShrink-linux-${{ steps.version.outputs.version }}-amd64
        asset_content_type: application/octet-stream

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: ./imgshrink-mobile-${{ steps.version.outputs.version }}-linux-amd64
        retention-days: 30

